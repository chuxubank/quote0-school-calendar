[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quote0-school-calendar"
version = "0.1.0"
description = "上海中小学校历 Quote/0 墨水屏生成与推送工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4"]

[project.scripts]
quote0-school = "quote0_school.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quote0_school"]
